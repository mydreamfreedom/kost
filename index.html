<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Kost</title>
<script>
/* Pilih manifest SEBELUM browser membacanya:
   - ?admin  = aplikasi "Kost Admin" (manifest-admin.json)
   - penghuni (ada link pribadi ?t=TOKEN atau token tersimpan) = manifest dibuat saat itu juga dengan start_url = link pribadi penghuni,
     supaya aplikasi yang dipasang langsung membuka dashboard penghuni itu sendiri
   - selain itu = manifest.json (umum) */
(function () {
  var q = new URLSearchParams(location.search), base = location.origin + location.pathname.replace(/[^\/]*$/, ''), href = 'manifest.json';
  if (q.get('admin') !== null) href = 'manifest-admin.json';
  else if (q.get('kosong') === null && q.get('aturan') === null) {
    var tk = q.get('t'); try { tk = tk || localStorage.getItem('kost_token'); } catch (e) {}
    if (tk) {
      try {
        var m = { id: base + '?app=penghuni', name: 'Dashboard Kost', short_name: 'Kost', start_url: base + '?t=' + encodeURIComponent(tk), scope: base, display: 'standalone', background_color: '#f4f6f8', theme_color: '#0f766e',
          icons: [{ src: base + 'icon-192.png', sizes: '192x192', type: 'image/png' }, { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png' }] };
        href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
      } catch (e) {}
    }
  }
  document.write('<link rel="manifest" href="' + href + '">');
})();
</script>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--pri:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{margin:0;font-size:18px}header p{margin:2px 0 0;opacity:.85;font-size:13px}
main{max-width:860px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:13px}.big{font-size:20px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:#dcfce7;color:var(--ok)}.b-warn{background:#fef3c7;color:var(--warn)}.b-bad{background:#fee2e2;color:var(--bad)}.b-gray{background:#e5e7eb;color:#374151}.b-blue{background:#dbeafe;color:#1d4ed8}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.sec,.btn.sec{background:#e5e7eb;color:#111}button.bad{background:var(--bad)}button.sm{padding:6px 10px;font-size:13px}
button.big-btn{width:100%;padding:13px;font-size:16px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:19px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.tabs button{background:#e5e7eb;color:#111;white-space:nowrap}.tabs button.on{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
dialog{border:0;border-radius:14px;padding:16px;width:min(440px,94vw)}dialog::backdrop{background:#0006}
#busy{width:min(300px,86vw);text-align:center;padding:22px 18px;font-weight:600}#busy::backdrop{background:#0009}
.spin{width:36px;height:36px;border:4px solid #e5e7eb;border-top-color:var(--pri);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:12px;margin-bottom:12px}
.ok{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.neg{color:var(--bad)}.right{text-align:right}
@media print{header,.noprint,#toast{display:none!important}body{background:#fff;font-size:12pt}.card{border:0!important;padding:0!important}main{max-width:none}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}
</style>
</head>
<body>
<header><h1 id="hTitle">Dashboard Kost</h1><p id="hSub"></p></header>
<main id="app"><div class="card">Memuat…</div></main>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<dialog id="busy"><div class="spin"></div><div id="busyTxt">Memproses…</div></dialog>

<script>
/* ====== KONFIGURASI: isi URL Web App Apps Script (hasil Deploy) ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwYS3ZuMqTO6gn8HSd1bGhxndEwedFjU_h70Md9sW_RfpP_uyQpf42kXRRPLXmpWItbyQ/exec';
/* ====================================================================== */

/* Panel admin dipasang sebagai aplikasi tersendiri ("Kost Admin") yang langsung membuka panel pengelola */
if (new URLSearchParams(location.search).get('admin') !== null) {
  document.title = 'Kost Admin';
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw-admin.js', { scope: './' }).catch(() => {}));
  const at = document.createElement('meta'); at.name = 'apple-mobile-web-app-title'; at.content = 'Kost Admin'; document.head.appendChild(at);
}

/* perbaiki alamat tanpa garis miring (mis. /kost?t=...) */
(function () { const p = location.pathname; if (!p.endsWith('/') && !/\.[a-z0-9]+$/i.test(p)) location.replace(p + '/' + location.search + location.hash); })();

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + Math.round(n || 0).toLocaleString('id-ID');
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const tgl = s => { if (!s) return '-'; const [y, m, d] = s.split('-'); return +d + ' ' + MONTHS[+m - 1] + ' ' + y; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3200); }

async function api(action, data = {}) {
  if (API_URL.startsWith('GANTI')) throw new Error('API_URL belum diisi di index.html');
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function safe(fn) { try { return await fn(); } catch (e) { toast(e.message); return null; } }

function badge(b) {
  if (b.sisa <= 0) return '<span class="badge b-ok">Lunas</span>';
  if (b.selisih_hari < 0) return '<span class="badge b-bad">Terlambat ' + b.terlambat_hari + ' hari</span>';
  if (b.status === 'Sebagian') return '<span class="badge b-warn">Sebagian</span>';
  return '<span class="badge b-gray">Belum bayar</span>';
}
function dueText(b) {
  if (b.sisa <= 0) return '';
  if (b.selisih_hari > 0) return 'Jatuh tempo ' + tgl(b.jatuh_tempo) + ' (' + b.selisih_hari + ' hari lagi)';
  if (b.selisih_hari === 0) return 'Jatuh tempo hari ini';
  return 'Jatuh tempo ' + tgl(b.jatuh_tempo);
}
function periodeLabel(p) { const m = /^(\d{4})-(\d{2})/.exec(p); if (m) return MONTHS[+m[2] - 1] + ' ' + m[1]; const d = new Date(p); return isNaN(d) ? String(p) : MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }

/* ================= HALAMAN PUBLIK: CEK KAMAR KOSONG (?kosong) ================= */
function waNum(hp) { hp = String(hp || '').replace(/\D/g, ''); if (hp.startsWith('0')) hp = '62' + hp.slice(1); else if (hp.startsWith('8')) hp = '62' + hp; return hp; }
async function publicView() {
  $('#hSub').textContent = 'Cek ketersediaan kamar';
  try { window.PUB = await api('availability'); }
  catch (e) { $('#app').innerHTML = '<div class="card neg">' + esc(e.message) + '</div>'; return; }
  $('#hTitle').textContent = window.PUB.nama_usaha || 'Kamar Kost';
  document.title = 'Kamar kosong • ' + (window.PUB.nama_usaha || 'Kost');
  drawPublic();
}
function drawPublic() {
  const d = window.PUB, f = window.PL || '', wa = waNum(d.wa);
  const locs = [...new Set(d.rooms.map(r => r.lokasi))];
  window.PLOCS = locs;
  const list = d.rooms.filter(r => !f || r.lokasi === f);
  let h = '';
  if (locs.length > 1) h += '<div class="tabs"><button class="' + (!f ? 'on' : '') + '" onclick="window.PL=\'\';drawPublic()">Semua lokasi</button>' + locs.map((l, i) => `<button class="${f === l ? 'on' : ''}" onclick="window.PL=window.PLOCS[${i}];drawPublic()">${esc(l)}</button>`).join('') + '</div>';
  const btn = (msg, label) => wa ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;background:#25d366;margin-top:8px" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">${label}</a>` : '';
  if (!list.length) h += `<div class="card"><b>Saat ini semua kamar sedang terisi.</b><div class="mut" style="margin-top:4px">Hubungi kami untuk masuk daftar tunggu.</div>${btn('Halo, saya ingin menanyakan kamar kost. Apakah ada yang akan kosong?', 'Hubungi via WhatsApp')}</div>`;
  list.forEach(r => {
    const msg = `Halo, saya tertarik dengan kamar ${r.nama} di ${r.lokasi} (${rp(r.harga_sewa)}/bulan). Apakah masih tersedia?`;
    h += `<div class="card">${r.foto_url ? `<img src="${esc(r.foto_url)}" alt="" loading="lazy" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px">` : ''}
      <div class="row"><b>Kamar ${esc(r.nama)}</b><span class="badge ${r.status === 'Kosong' ? 'b-ok' : 'b-warn'}">${r.status === 'Kosong' ? 'Tersedia' : 'Tersedia mulai ' + tgl(r.tersedia_mulai)}</span></div>
      <div class="mut">${esc(r.lokasi)}</div>
      <div class="big" style="margin:6px 0">${rp(r.harga_sewa)}<span class="mut"> / bulan</span></div>
      ${r.fasilitas ? `<div class="mut">${esc(r.fasilitas)}</div>` : ''}
      ${btn(msg, 'Tanya via WhatsApp')}</div>`;
  });
  h += `<p class="mut" style="text-align:center">Diperbarui ${tgl(d.diperbarui)} • v17</p>`;
  $('#app').innerHTML = h;
}

/* ================= PENGHUNI ================= */
let DEFERRED = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFERRED = e; if (window.__redraw) window.__redraw(); });
let TOKEN = new URLSearchParams(location.search).get('t') || localStorage.getItem('kost_token') || '';
let CFG = null;

async function start() {
  if (new URLSearchParams(location.search).get('kosong') !== null) return publicView();
  if (new URLSearchParams(location.search).get('aturan') !== null) return aturanView();
  try { CFG = await api('config'); $('#hTitle').textContent = CFG.nama_usaha || 'Dashboard Kost'; } catch (e) { $('#app').innerHTML = '<div class="card neg">' + esc(e.message) + '</div>'; return; }
  const p = new URLSearchParams(location.search);
  if (p.get('admin') !== null) return adminView();
  if (TOKEN) { localStorage.setItem('kost_token', TOKEN); return tenantView(); }
  $('#app').innerHTML = `<div class="card"><h3 style="margin-top:0">Masuk</h3>
    <label>Kode akses penghuni (dari pengelola)</label><input id="code" autocapitalize="off" placeholder="mis. a1b2c3d4e5f6g7h8">
    <button class="big-btn" onclick="enterCode()">Buka dashboard saya</button>
    <p class="mut" style="margin-top:14px">Pengelola? <a href="?admin">Masuk sebagai admin</a></p></div>`;
}
function enterCode() { const c = $('#code').value.trim(); if (!c) return; TOKEN = c; localStorage.setItem('kost_token', c); history.replaceState(null, '', '?t=' + encodeURIComponent(c)); tenantView(); }

async function tenantView() {
  let d;
  try { d = await api('tenant', { token: TOKEN }); }
  catch (e) { localStorage.removeItem('kost_token'); $('#app').innerHTML = '<div class="card neg">' + esc(e.message) + '</div>'; return; }
  history.replaceState(null, '', '?t=' + encodeURIComponent(TOKEN)); // agar "Add to Home Screen" menyimpan link pribadi
  $('#hSub').textContent = d.nama + ' • Kamar ' + d.kamar + (d.lokasi ? ' • ' + d.lokasi : '');
  window.TD = d;
  if (d.aturan && d.aturan.perlu_setuju) return consentView(d); // wajib setuju tata tertib dulu (backend v19+)
  const open = d.bills.filter(b => b.sisa > 0);
  const totalSisa = open.reduce((s, b) => s + b.sisa, 0);
  let h = '<div id="pushbox"></div><div id="bonusbox"></div>';
  h += `<div class="card"><div class="mut">Total yang harus dibayar</div><div class="big ${totalSisa > 0 ? '' : ''}">${rp(totalSisa)}</div>
    ${totalSisa === 0 ? '<div class="mut">Tidak ada tagihan. Terima kasih! 🙌</div>' : ''}</div>`;
  if (d.info_pembayaran) h += `<div class="card"><b>Cara pembayaran</b><div class="mut" style="white-space:pre-line;margin-top:4px">${esc(d.info_pembayaran)}</div></div>`;
  h += '<h3 style="margin:16px 4px 8px">Tagihan</h3>';
  d.bills.forEach(b => {
    // v19: pembayaran yang sudah dikirim tapi belum dikonfirmasi pengelola
    const pend = (d.payments || []).filter(p => p.tagihan_id === b.tagihan_id && p.status === 'Menunggu');
    const pendTotal = pend.reduce((s, p) => s + p.jumlah, 0);
    let aksi = '';
    if (b.sisa > 0) {
      if (pend.length) {
        aksi = `<div class="ok" style="margin:8px 0 0">⏳ Pembayaran ${rp(pendTotal)} sudah terkirim dan menunggu konfirmasi pengelola. Tidak perlu kirim lagi.</div>`;
        if (b.sisa - pendTotal > 0) aksi += `<div class="actions"><button class="sec sm" onclick="payDlg('${b.tagihan_id}',${b.sisa - pendTotal})">Kirim pembayaran lain</button></div>`;
      } else {
        aksi = `<div class="actions"><button onclick="payDlg('${b.tagihan_id}',${b.sisa})">Saya sudah bayar</button></div>`;
      }
    }
    h += `<div class="card"><div class="row"><b>${b.jenis === 'Deposit' ? 'Deposit' : b.jenis + ' ' + periodeLabel(b.periode)}</b>${badge(b)}</div>
      <div class="mut">${dueText(b)}${b.keterangan ? '<br>' + esc(b.keterangan) : ''}</div>
      <table style="margin-top:8px"><tr><td>Pokok</td><td>${rp(b.jumlah)}</td></tr>
      ${b.denda > 0 ? `<tr><td class="neg">Denda</td><td class="neg">${rp(b.denda)}</td></tr>` : ''}
      ${b.keringanan > 0 ? `<tr><td>Keringanan</td><td>-${rp(b.keringanan)}</td></tr>` : ''}
      ${b.dibayar > 0 ? `<tr><td>Sudah dibayar</td><td>-${rp(b.dibayar)}</td></tr>` : ''}
      <tr><td><b>Sisa</b></td><td><b>${rp(b.sisa)}</b></td></tr></table>
      ${aksi}</div>`;
  });
  h += `<div class="mut" style="margin:4px 4px 12px">${esc(d.aturan_denda)}</div>`;
  h += '<h3 style="margin:16px 4px 8px">Riwayat pembayaran</h3><div class="card">';
  h += d.payments.length ? '<table>' + d.payments.map(p => `<tr><td>${tgl(p.tanggal)} • ${esc(p.metode)}</td><td>${rp(p.jumlah)}</td><td>${p.status === 'Dikonfirmasi' ? '✅' : p.status === 'Ditolak' ? '❌' : '⏳'}</td></tr>`).join('') + '</table><div class="mut">⏳ menunggu konfirmasi pengelola</div>' : '<span class="mut">Belum ada pembayaran.</span>';
  h += '</div>';
  h += serahCards(d);
  h += helpCard(d);
  h += '<p class="mut" style="text-align:center">v19</p>';
  $('#app').innerHTML = h;
  initPush(d);
  bonusLoad();
}

/* ---- Bonus Aktivasi (backend Bonus.gs; kartu otomatis tersembunyi jika backend belum dipasang atau promo tidak berlaku) ---- */
const BONUS_BADGE = { 'Belum lengkap': ['b-warn', 'Selesaikan langkah'], 'Lengkap': ['b-blue', 'Terdaftar'], 'Diterapkan': ['b-ok', 'Potongan aktif'], 'Terpenuhi': ['b-ok', 'Diterima ✅'], 'Hangus': ['b-bad', 'Tidak berlaku'], 'Cek manual': ['b-warn', 'Dicek pengelola'], 'Lewat batas': ['b-gray', 'Berakhir'] };
function bonusHtml(b) {
  const bd = BONUS_BADGE[b.status] || ['b-gray', b.status];
  const aktif = !['Hangus', 'Lewat batas'].includes(b.status);
  return `<div class="card" style="border:1.5px solid ${aktif ? 'var(--pri)' : '#e5e7eb'}">
    <div class="row"><b>🎁 Bonus Aktivasi ${rp(b.nominal)}</b><span class="badge ${bd[0]}">${esc(bd[1])}</span></div>
    <div class="mut" style="margin:4px 0 8px">Potongan sewa ${esc(b.periode_label)} untuk penghuni yang memakai aplikasi. Berlaku satu kali.</div>
    ${b.langkah.map((l, i) => `<div style="display:flex;gap:8px;margin:5px 0"><span>${l.ok ? '✅' : '⬜'}</span><span ${l.ok ? 'class="mut" style="text-decoration:line-through"' : ''}>${i + 1}. ${esc(l.label)}</span></div>`).join('')}
    ${b.pesan ? `<div class="${aktif ? 'ok' : 'mut'}" style="margin:10px 0 0">${esc(b.pesan)}</div>` : ''}</div>`;
}
async function bonusLoad() {
  const box = $('#bonusbox'); if (!box) return;
  let b; try { b = await api('bonus', { token: TOKEN }); } catch (e) { return; }
  window.BONUS = b; if (!b || !b.tampil) return;
  box.innerHTML = bonusHtml(b);
}

/* ---- Serah terima kamar & deposit (penghuni) ---- */
function fotoGrid(ids) {
  return ids && ids.length ? `<div class="actions">${ids.map(i => `<a target="_blank" rel="noopener" href="https://drive.google.com/file/d/${encodeURIComponent(i)}/view"><img loading="lazy" alt="foto kamar" style="width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)" src="https://drive.google.com/thumbnail?id=${encodeURIComponent(i)}&sz=w400"></a>`).join('')}</div>` : '';
}
function clTable(cl) {
  return `<table style="margin-top:6px">${(cl || []).map(c => `<tr><td>${esc(c.item)}</td><td>${c.kondisi === 'Baik' ? '✅ Baik' : '⚠️ ' + esc(c.catatan)}</td></tr>`).join('')}</table>`;
}
function serahCards(d) {
  const sr = d.serah; if (!sr) return '';
  let h = '';
  const m = sr.masuk;
  if (m) {
    h += `<h3 style="margin:16px 4px 8px">Serah terima kamar</h3><div class="card"><div class="row"><b>Kondisi kamar saat masuk</b><span class="badge ${m.setuju_waktu ? 'b-ok' : 'b-warn'}">${m.setuju_waktu ? '✓ disetujui' : 'menunggu persetujuan'}</span></div>
      <div class="mut">Dicatat ${esc(m.waktu || '')}</div>${clTable(m.checklist)}${fotoGrid(m.foto)}
      ${sr.token && m.saldo_token != null ? `<div class="mut" style="margin-top:6px">⚡ Saldo token saat masuk: <b>${rp(m.saldo_token)}</b>. Saat pindah, saldo token harus dikembalikan seperti semula.</div>` : ''}
      ${m.catatan ? `<div class="mut" style="margin-top:6px">Catatan: ${esc(m.catatan)}</div>` : ''}
      ${m.setuju_waktu ? '' : `<div class="actions"><button onclick="ackSerah('${m.st_id}')">Saya setuju dengan kondisi awal ini</button></div>`}</div>`;
  }
  const k = sr.keluar, dp = sr.deposit;
  if (k || dp) {
    h += `<h3 style="margin:16px 4px 8px">Penyelesaian deposit</h3><div class="card">`;
    if (k) h += `<div class="mut">Kondisi kamar saat keluar (${esc(k.waktu || '')})</div>${clTable(k.checklist)}${fotoGrid(k.foto)}${sr.token && k.saldo_token != null ? `<div class="mut">⚡ Saldo token akhir: <b>${rp(k.saldo_token)}</b></div>` : ''}${k.catatan ? `<div class="mut">Catatan: ${esc(k.catatan)}</div>` : ''}`;
    if (dp) {
      h += `<table style="margin-top:8px"><tr><td>Deposit dibayar</td><td>${rp(dp.deposit_dibayar)}</td></tr>
        ${(dp.rincian || []).map(i => `<tr><td class="neg">− ${esc(i.alasan)}</td><td class="neg">${rp(i.jumlah)}</td></tr>`).join('')}
        ${dp.hangus ? `<tr><td class="neg">Deposit hangus: ${esc(dp.hangus_alasan)}</td><td class="neg">${rp(dp.deposit_dibayar)}</td></tr>` : ''}

function compress(file, maxPx, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const max = maxPx || 1100, k =Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q || .72).split(',')[1]); URL.revokeObjectURL(url); };
    img.onerror = () => rej(new Error('Foto tidak bisa dibaca')); img.src = url;
  });
}

function renderAturan(teks) {

function sigPad(cv) {
  const g = cv.getContext('2d'); let on = false, last = null, ink = 0;
  const fit = () => {
    const r = cv.getBoundingClientRect(), k = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    cv.width = Math.round((r.width || 300) * k); cv.height = Math.round((r.height || 170) * k);
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    g.lineWidth = 2.5 * k; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111'; ink = 0;
  };
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / (r.width || 1), y: (e.clientY - r.top) * cv.height / (r.height || 1) }; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} on = true; last = pos(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(last.x + .1, last.y + .1); g.stroke(); });
  cv.addEventListener('pointermove', e => { if (!on) return; e.preventDefault(); const p = pos(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); ink += Math.hypot(p.x - last.x, p.y - last.y); last = p; });
  const up = () => { on = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  fit();
  return { clear: fit, kosong: () => ink < 60 * (cv.width / (cv.getBoundingClientRect().width || cv.width)), data: () => cv.toDataURL('image/png').split(',')[1] };
}

/* ---- Push notification (OneSignal) ---- */
/* Browser bawaan HP / aplikasi lain (WhatsApp, Instagram, vivo, Xiaomi, dll) sering tidak mendukung push → arahkan ke Chrome */
function bukanBrowserPush() {
  const ua = navigator.userAgent;
  return /Android/i.test(ua) && /; wv\)|FBAN|FBAV|Instagram|Line\/|MiuiBrowser|VivoBrowser|HeyTapBrowser|OppoBrowser|UCBrowser|OPR\/|Opera/i.test(ua);
}
function bukaDiChrome() {
  const u = 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end';
  location.href = u;
}
function initPush(d) {
  const box = $('#pushbox');
  if (!CFG.onesignal_app_id) return;
  if (bukanBrowserPush()) {
    box.innerHTML = `<div class="warn"><b>🔔 Buka lewat Chrome supaya notifikasi aktif</b><div class="mut" style="margin:4px 0 8px">Browser yang sedang dipakai belum mendukung notifikasi tagihan.</div><button class="big-btn" onclick="bukaDiChrome()">Buka di Chrome</button></div>`;
    return;
  }
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (ios && !standalone) {
    box.innerHTML = `<div class="warn"><b>🔔 Aktifkan notifikasi tagihan (iPhone)</b>
      <ol style="margin:6px 0 0 18px;padding:0"><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ↑) di Safari</li><li>Pilih <b>Tambah ke Layar Utama</b> (Add to Home Screen)</li><li>Buka aplikasi dari <b>ikon di layar utama</b></li><li>Ketuk tombol <b>Aktifkan Notifikasi</b> lalu pilih <b>Izinkan</b></li></ol></div>`;
    return;
  }
  if (!('Notification' in window)) { box.innerHTML = '<div class="warn">Browser ini belum mendukung notifikasi. Cek dashboard ini secara berkala.</div>'; return; }
  const seg = location.pathname.split('/')[1] || '';
  const base = (location.hostname.endsWith('github.io') && seg && !seg.includes('.')) ? '/' + seg + '/' : '/';
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async OS => { try {
    await OS.init({ appId: CFG.onesignal_app_id, serviceWorkerPath: base.slice(1) + 'OneSignalSDKWorker.js', serviceWorkerParam: { scope: base }, allowLocalhostAsSecureOrigin: true });
    await OS.login(d.penghuni_id);
    const instBtn = () => (DEFERRED && !standalone) ? '<button class="big-btn sec" id="inBtn" style="margin-bottom:12px">📲 Pasang di layar utama</button>' : '';
    const bindInst = () => { const b = $('#inBtn'); if (b) b.onclick = async () => { DEFERRED.prompt(); await DEFERRED.userChoice; DEFERRED = null; b.remove(); }; };
    const draw = () => {
      if (OS.User.PushSubscription.optedIn) {
        box.innerHTML = '<div class="ok">🔔 Notifikasi tagihan aktif</div>' + instBtn(); bindInst();
        if (!d.push_aktif) { d.push_aktif = true; api('registerPush', { token: TOKEN }).catch(() => {}); }
      } else if (Notification.permission === 'denied') {
        box.innerHTML = '<div class="warn"><b>🔕 Notifikasi diblokir.</b><ol style="margin:6px 0 0 18px;padding:0"><li>Ketuk ikon <b>gembok</b> (atau <b>⋮</b> → Info) di sebelah alamat situs</li><li>Pilih <b>Izin</b> / <b>Setelan situs</b> → <b>Notifikasi</b></li><li>Ubah ke <b>Izinkan</b>, lalu muat ulang halaman ini</li></ol></div>';
      } else {
        box.innerHTML = '<div class="warn"><b>🔔 Notifikasi belum aktif</b><div class="mut" style="margin:4px 0 8px">Aktifkan agar Anda diingatkan sebelum jatuh tempo.</div><button class="big-btn" id="enBtn">🔔 Aktifkan Pengingat Tagihan</button></div>';
        $('#enBtn').onclick = async () => {
          try {
            await OS.Notifications.requestPermission();
            // izin sudah "diizinkan" tetapi status masih Unsubscribed → aktifkan lagi langganannya
            if (!OS.User.PushSubscription.optedIn && Notification.permission === 'granted') await OS.User.PushSubscription.optIn();
          } catch (e) {}
          draw();
        };
        box.insertAdjacentHTML('beforeend', instBtn()); bindInst();
      }
    };
    window.__redraw = draw;
    OS.User.PushSubscription.addEventListener('change', draw);
    draw();
  } catch (e) { box.innerHTML = '<div class="warn"><b>Notifikasi error:</b> ' + esc((e && e.message) || e) + '</div>'; } });
  setTimeout(() => { if (!box.innerHTML) box.innerHTML = '<div class="warn">Layanan notifikasi belum termuat. Muat ulang halaman.</div>'; }, 8000);
}

/* ---- Kamar: ketersediaan, booking, rencana keluar ---- */
const plusDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const isBebas = r => r.status === 'Kosong' || (r.status === 'Akan Kosong' && !r.dibooking);
function roomBadge(r) {
  let h = r.status === 'Kosong' ? '<span class="badge b-ok">Kosong</span>' : r.status === 'Akan Kosong' ? '<span class="badge b-warn">Akan kosong</span>' : r.status === 'Tidak Tersedia' ? '<span class="badge b-bad">Tidak tersedia</span>' : r.status === 'Terisi' ? '<span class="badge b-gray">Terisi</span>' : '';
  if (r.dibooking) h += ' <span class="badge b-blue">Dibooking</span>';
  return h;
}
function kosongBase() { return (AD.frontend_url || location.origin + location.pathname).replace(/\/$/, ''); }
function kosongText() {
  const rows = AD.rooms.filter(isBebas);
  if (!rows.length) return 'Mohon maaf, saat ini semua kamar sedang terisi. Silakan hubungi kami untuk daftar tunggu 🙏';
  const by = {};
  rows.forEach(r => { const l = r.lokasi || 'Lainnya'; (by[l] = by[l] || []).push(r); });
  let t = 'Kamar tersedia - ' + (AD.nama_usaha || 'Kost') + '\n';
  Object.keys(by).forEach(l => {
    t += '\n*' + l + '*\n';
    by[l].forEach(r => { t += '• ' + r.nama + ' - ' + rp(r.harga_sewa) + '/bulan' + (r.fasilitas ? ' (' + r.fasilitas + ')' : '') + (r.status === 'Akan Kosong' ? ' - tersedia mulai ' + tgl(r.tersedia_mulai) : '') + '\n'; });
  });
  return t + '\nLihat selengkapnya: ' + kosongBase() + '/?kosong';
}
function tKamar() {
  const f = window.RF || 'bebas';
  const flt = { bebas: isBebas, dibooking: r => r.dibooking, terisi: r => r.status === 'Terisi' || r.status === 'Akan Kosong', semua: () => true }[f];
  const list = AD.rooms.filter(flt);
  let h = `<div class="actions" style="margin:0 0 10px"><button class="sm" onclick="copyLink(kosongText())">Salin teks untuk calon penghuni</button><button class="sm sec" onclick="copyLink(kosongBase()+'/?kosong')">Salin link cek kamar</button><button class="sm sec" onclick="copyLink(kosongBase()+'/?aturan')">Salin link tata tertib</button></div>`;
  h += `<div class="tabs">${[['bebas', 'Bisa ditawarkan (' + AD.rooms.filter(isBebas).length + ')'], ['dibooking', 'Dibooking'], ['terisi', 'Terisi'], ['semua', 'Semua']].map(x => `<button class="${f === x[0] ? 'on' : ''}" onclick="window.RF='${x[0]}';tKamar()">${x[1]}</button>`).join('')}</div>`;
  const by = {};
  list.forEach(r => { const l = r.lokasi || 'Tanpa lokasi'; (by[l] = by[l] || []).push(r); });
  const names = Object.keys(by);
  if (!names.length) h += '<div class="card mut">Tidak ada kamar pada filter ini.</div>';
  names.forEach(l => { h += `<h3 style="margin:14px 4px 8px">${esc(l)} <span class="mut">(${by[l].length})</span></h3>` + by[l].map(roomCard).join(''); });
  $('#tab').innerHTML = h;
}
function roomCard(r) {
  const id = esc(r.kamar_id);
  let extra = '';
  if (r.status === 'Terisi') extra = 'Penghuni: ' + esc(r.penghuni);
  if (r.status === 'Akan Kosong') extra = esc(r.penghuni) + ' keluar ' + tgl(r.tersedia_mulai);
  if (r.booking_nama && (r.dibooking || r.booking_kadaluarsa)) extra += (extra ? '<br>' : '') + (r.dibooking ? 'Dibooking: ' : 'Booking kedaluwarsa: ') + esc(r.booking_nama) + (r.booking_sampai ? ' s/d ' + tgl(r.booking_sampai) : '');
  let act = '';
  if (r.kosong) act += `<button class="sm" onclick="tenantDlg('${id}')">Isi penghuni</button>`;
  if (r.status === 'Kosong' || r.status === 'Akan Kosong' || r.status === 'Dibooking') act += `<button class="sm sec" onclick="bookDlg('${id}')">${r.dibooking ? 'Ubah booking' : 'Booking'}</button>`;
  if (r.dibooking || r.booking_kadaluarsa) act += `<button class="sm sec" onclick="roomGo('${id}','bersihkan')">Batal booking</button>`;
  if (r.status === 'Kosong') act += `<button class="sm sec" onclick="roomGo('${id}','tidak_tersedia')">Tandai tidak tersedia</button>`;
  if (r.status === 'Tidak Tersedia') act += `<button class="sm sec" onclick="roomGo('${id}','bersihkan')">Tandai tersedia</button>`;
  return `<div class="card"><div class="row"><b>Kamar ${esc(r.nama)}</b><span>${roomBadge(r)}</span></div>
    <div class="mut">${rp(r.harga_sewa)}/bln${r.fasilitas ? ' • ' + esc(r.fasilitas) : ''}${extra ? '<br>' + extra : ''}</div>
    ${act ? `<div class="actions">${act}</div>` : ''}</div>`;
}

  const d = $('#dlg');
  d.innerHTML = `<h3 style="margin-top:0">Booking kamar ${esc(r.nama)}</h3><div class="mut">${esc(r.lokasi)}</div>
    <label>Nama pemesan</label><input id="bn" value="${esc(r.booking_nama || '')}">

    <div class="actions"><button onclick="planGo('${esc(pid)}')">Simpan</button><button class="sec" onclick="$('#dlg').close()">Batal</button></div>`;

function installCard() {

  if (standalone || tutup) return '';
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const mobile = ios || /Android/i.test(navigator.userAgent);
  let isi;
  if (DEFERRED) isi = '<button class="big-btn" onclick="pasangGo()">Pasang aplikasi di layar utama</button>';
  else if (ios) isi = '<ol style="margin:6px 0 0 18px;padding:0"><li>Buka halaman ini lewat <b>Safari</b></li><li>Ketuk <b>Bagikan</b> (kotak dengan panah ↑)</li><li>Pilih <b>Tambah ke Layar Utama</b></li><li>Buka dari ikon <b>Kost Admin</b>, lalu login sekali</li></ol>';
  else if (mobile) isi = '<div class="mut">Buka menu <b>⋮</b> di Chrome, lalu pilih <b>Instal aplikasi</b> (atau <b>Tambahkan ke layar utama</b>).</div>';

}

/* ---- Kirim link dashboard ke penghuni lewat WhatsApp (satu ketuk per penghuni, pesan sudah terisi) ---- */
// Emoji bisa rusak (tampil "?") jika dibawa lewat link wa.me di WhatsApp Web/komputer.
// Karena itu di komputer pesan DISALIN ke clipboard lalu chat dibuka (emoji utuh); di HP dikirim langsung lewat link.
const PESAN_LINK_DEFAULT = `Halo {nama} 👋
Ini link dashboard tagihan kost Anda di {usaha} (Kamar {kamar}, {lokasi}):
{link}

Cara pakai:
1. Buka link di atas, lalu simpan/bookmark.
2. Ketuk tombol "Aktifkan Pengingat Tagihan" dan pilih "Izinkan", supaya Anda diingatkan sebelum jatuh tempo.
(iPhone: buka lewat Safari > ketuk Bagikan > Tambah ke Layar Utama, lalu buka dari ikon di layar utama dan aktifkan notifikasi)

Link ini khusus untuk Anda, mohon tidak dibagikan ke orang lain. Terima kasih 🙏`;
const linkOf = t => kosongBase() + '/?t=' + t.token;
function pesanLink(t) {
  const v = { nama: t.nama, kamar: t.kamar, lokasi: t.lokasi, usaha: AD.nama_usaha || 'Kost', link: linkOf(t) };
  return (AD.pesan_link || PESAN_LINK_DEFAULT).replace(/\{(nama|kamar|lokasi|usaha|link)\}/g, (m, k) => v[k]);
}
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
// Mode (Pengaturan > wa_mode): otomatis (bawaan: HP=langsung, komputer=salin) | langsung | salin
function bukaWA(hp, pesan) {
  const m = AD.wa_mode, mode = (m === 'langsung' || m === 'salin') ? m : (IS_MOBILE ? 'langsung' : 'salin');
  if (mode === 'salin' && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(pesan).then(
      () => toast('Pesan sudah disalin. Di WhatsApp: tempel (Ctrl+V) lalu Kirim'),
      () => prompt('Salin pesan ini lalu tempel di WhatsApp:', pesan));
    window.open('https://wa.me/' + hp, '_blank', 'noopener');
    return;
  }
  window.open('https://wa.me/' + hp + '?text=' + encodeURIComponent(pesan), '_blank', 'noopener');
}
function kirimLink(pid) {
  const t = AD.tenants.find(x => x.penghuni_id === pid); if (!t) return;
  const hp = waNum(t.hp); if (!hp) return toast('No. HP ' + t.nama + ' belum diisi di sheet Penghuni');
  bukaWA(hp, pesanLink(t));
  t.link_dikirim = AD.hari_ini; tPenghuni();
  A('tandaiLink', { penghuni_id: pid }).catch(() => {}); // simpan penanda, tanpa mengunci layar
}
function kirimBerikutnya() {
  const t = AD.tenants.find(x => !x.link_dikirim && waNum(x.hp));
  if (!t) { const sisa = AD.tenants.filter(x => !x.link_dikirim).length; return toast(sisa ? sisa + ' penghuni belum punya No. HP di sheet Penghuni' : 'Semua link sudah dikirim'); }
  kirimLink(t.penghuni_id);
}
function tPenghuni() {
  const base = kosongBase();
  const belum = AD.tenants.filter(t => !t.link_dikirim).length;
  let h = `<div class="actions" style="margin-bottom:10px"><button onclick="tenantDlg()">+ Penghuni baru</button>${belum ? `<button style="background:#25d366" onclick="kirimBerikutnya()">Kirim link berikutnya via WA (${belum} belum)</button>` : '<span class="mut">✅ Semua link sudah dikirim</span>'}</div>`;
  h += AD.tenants.map(t => `<div class="card"><div class="row"><b>${esc(t.nama)}</b><span><span class="badge ${t.link_dikirim ? 'b-ok' : 'b-gray'}">${t.link_dikirim ? '✓ link dikirim ' + tgl(t.link_dikirim) : 'link belum dikirim'}</span> <span class="badge ${t.push_aktif ? 'b-ok' : 'b-warn'}">${t.push_aktif ? '🔔 aktif' : '🔕 belum'}</span>${AD.fitur_aturan ? ` <span class="badge ${t.setuju_ok ? 'b-ok' : 'b-warn'}">${t.setuju_ok ? '✓ setuju tata tertib' : 'belum setuju'}</span>` : ''}</span></div>

const PESAN_PANDUAN_PUSH = `Halo {nama} 👋
Supaya kamu dapat pengingat tagihan kost otomatis di HP, yuk aktifkan notifikasinya (cuma 1 menit):

1. Buka link ini lewat *Chrome*:
{link}
2. Ketuk tombol "Aktifkan Pengingat Tagihan", lalu pilih "Izinkan".
3. Kalau muncul tulisan "Notifikasi diblokir": ketuk ikon gembok di sebelah alamat → Izin → Notifikasi → Izinkan, lalu muat ulang halaman.
(iPhone: buka lewat Safari > Bagikan > Tambah ke Layar Utama, lalu buka dari ikon di layar utama dan aktifkan notifikasi)

Terima kasih 🙏`;
function tenantBills(t) { return AD.bills.filter(b => b.sisa > 0 && (b.penghuni_id ? b.penghuni_id === t.penghuni_id : (b.nama === t.nama && b.kamar === t.kamar))); }
function pesanPengingat(t) {
  const open = tenantBills(t), link = linkOf(t), usaha = AD.nama_usaha || 'Kost';
  if (!open.length) return `Halo ${t.nama} 👋\nIni dari ${usaha}. Tagihan kamu saat ini sudah lunas, terima kasih 🙌\nDashboard pribadi kamu: ${link}`;
  const total = open.reduce((s, b) => s + b.sisa, 0);
  const baris = open.map(b => '• ' + (b.jenis === 'Deposit' ? 'Deposit' : b.jenis + ' ' + periodeLabel(b.periode)) + ': ' + rp(b.sisa) + (b.denda > 0 ? ' (termasuk denda ' + rp(b.denda) + ')' : '') + ', jatuh tempo ' + tgl(b.jatuh_tempo)).join('\n');
  return `Halo ${t.nama} 👋\nPengingat tagihan kost ${usaha} (Kamar ${t.kamar}, ${t.lokasi}):\n${baris}\nTotal: ${rp(total)}\n\nCek rincian dan konfirmasi pembayaran di dashboard kamu:\n${link}\nTerima kasih 🙏`;
}
function kirimWA(pid, jenis) {
  const t = AD.tenants.find(x => x.penghuni_id === pid); if (!t) return;
  const hp = waNum(t.hp); if (!hp) return toast('No. HP ' + t.nama + ' belum diisi di sheet Penghuni');
  const pesan = jenis === 'panduan' ? PESAN_PANDUAN_PUSH.replace('{nama}', t.nama).replace('{link}', linkOf(t)) : pesanPengingat(t);
  bukaWA(hp, pesan);
}

async function tesPush(pid) {

  let h = `<div class="grid"><div class="stat"><span class="mut">Terjangkau push</span><b>${aktif.length}/${AD.tenants.length}</b></div><div class="stat"><span class="mut">Belum terjangkau</span><b class="${belum.length ? 'neg' : ''}">${belum.length}</b></div></div>`;

  if (aktif.length) h += `<h3 style="margin:14px 4px 8px">Sudah aktif (${aktif.length})</h3>` + aktif.map(kartu).join('');

function copyLink(u) { navigator.clipboard.writeText(u).then(() => toast('Link disalin'), () => prompt('Salin link:', u)); }
/* ---- Admin: serah terima & deposit ---- */
function tenantById(id) { return AD.tenants.find(x => x.penghuni_id === id); }
function clForm(prefix) {
  return `<div style="max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px">${(AD.serah_item || []).map((it, i) => `<div style="padding:4px 0;border-bottom:1px solid var(--line)"><div class="row"><span>${esc(it)}</span><select id="${prefix}k${i}" style="width:auto;margin:0" onchange="$('#${prefix}c${i}').style.display=this.value==='Baik'?'none':'block'"><option>Baik</option><option>Ada catatan</option></select></div><input id="${prefix}c${i}" maxlength="200" placeholder="Jelaskan kondisinya" style="display:none"></div>`).join('')}</div>`;
}
function clRead(prefix) {
  return (AD.serah_item || []).map((it, i) => ({ item: it, kondisi: $('#' + prefix + 'k' + i).value, catatan: $('#' + prefix + 'c' + i).value.trim() }));
}
async function fotosRead(id) {
  const fs = [...($('#' + id).files || [])].slice(0, 6);
  return Promise.all(fs.map(async f => ({ data: await compress(f, 1000, .7) })));
}
function serahInDlg(id) {

}

function serahOutDlg(id) {

  d.innerHTML = `<h3 style="margin-top:0">Serah terima keluar & deposit • ${esc(t.nama)}</h3><div class="mut">Kamar ${esc(t.kamar)} • Deposit dibayar ${rp(t.deposit_dibayar || 0)}</div>

    ${t.lokasi_token ? `<label>Saldo token akhir (Rp) — awal ${rp(t.st_masuk && t.st_masuk.saldo_token != null ? t.st_masuk.saldo_token : (t.token_awal || 20000))}</label><input id="sot" type="number" inputmode="numeric" oninput="soHitung()"><label style="display:flex;gap:6px;align-items:center"><input id="soa" type="checkbox" style="width:auto;margin:0" onchange="soHitung()"> Abaikan potongan token</label>` : ''}
    <label>Potongan lain (pembersihan/perbaikan)</label>
    <div id="sop">${[0, 1, 2].map(i => `<div class="row" style="gap:6px"><input id="sa${i}" placeholder="Alasan" maxlength="120" style="margin:0"><input id="sj${i}" type="number" inputmode="numeric" placeholder="Rp" style="margin:0;width:110px" oninput="soHitung()"></div>`).join('')}</div>
    <label style="display:flex;gap:6px;align-items:center"><input id="soh" type="checkbox" style="width:auto;margin:0" onchange="$('#sohw').style.display=this.checked?'block':'none';soHitung()"> Pelanggaran berat (deposit hangus)</label>
    <input id="sohw" maxlength="200" placeholder="Alasan pelanggaran berat" style="display:none">
    <label>Catatan (opsional)</label><input id="soc" maxlength="300">
    <div class="ok" id="soh2" style="margin-top:10px"></div>
    <div class="actions"><button onclick="serahOutGo()">Simpan rincian</button><button class="sec" onclick="$('#dlg').close()">Batal</button></div>`;
  d.showModal(); soHitung();
}
function soData() {
  const t = tenantById(window.SO.id), dep = t.deposit_dibayar || 0;
  let total = 0;
  const potongan = [0, 1, 2].map(i => ({ alasan: $('#sa' + i).value.trim(), jumlah: Number($('#sj' + i).value) || 0 })).filter(p => p.alasan || p.jumlah);
  potongan.forEach(p => total += p.jumlah);
  let tokenKurang = 0;
  if (t.lokasi_token && $('#sot') && $('#sot').value !== '' && !$('#soa').checked) {
    const awal = t.st_masuk && t.st_masuk.saldo_token != null ? t.st_masuk.saldo_token : (t.token_awal || 20000);
    tokenKurang = Math.max(0, awal - Number($('#sot').value)); total += tokenKurang;
  }
  const hangus = $('#soh').checked;
  return { t, dep, potongan, total, tokenKurang, hangus, sisa: hangus ? 0 : Math.max(0, dep - total), kurang: hangus ? 0 : Math.max(0, total - dep) };
}
function soHitung() {
  const x = soData();
  $('#soh2').innerHTML = `Deposit ${rp(x.dep)}${x.tokenKurang ? '<br>Kekurangan token: ' + rp(x.tokenKurang) : ''}<br>Total potongan: <b>${rp(x.total)}</b>${x.hangus ? '<br><b class="neg">Deposit hangus seluruhnya</b>' : ''}<br>Sisa dikembalikan: <b>${rp(x.sisa)}</b>${x.kurang ? `<br><span class="neg">Biaya melebihi deposit: ${rp(x.kurang)} (ditagih ke penghuni)</span>` : ''}`;
}
async function serahOutGo() {
  const x = soData(), id = window.SO.id;
  if (x.t.lokasi_token && $('#sot').value === '') return toast('Isi saldo token akhir');
  if (!confirm('Simpan rincian penyelesaian? Sisa dikembalikan ' + rp(x.sisa) + '. Penghuni akan menerima notifikasi.')) return;
  const r = await safe(async () => A('handoverOut', { penghuni_id: id, checklist: clRead('so'), foto: await fotosRead('sof'), saldo_token: x.t.lokasi_token ? $('#sot').value : '', token_abaikan: x.t.lokasi_token ? $('#soa').checked : false, potongan: x.potongan, hangus: x.hangus, hangus_alasan: $('#sohw').value, catatan: $('#soc').value }));

}

    <div class="card"><b>Terbaru</b><table>${AD.expenses.map(x => `<tr><td>${tgl(x.tanggal)}<div class="mut">${esc(x.lokasi)} • ${esc(x.kategori)}${x.deskripsi ? ' • ' + esc(x.deskripsi) : ''}</div></td><td>${rp(x.jumlah)}</td></tr>`).join('') || '<tr><td class="mut">Belum ada.</td></tr>'}</table></div>`;
}
async function expGo() { if (await safe(() => A('addExpense', { tanggal: $('#xt').value, lokasi_id: $('#xl').value, kategori: $('#xk').value, deskripsi: $('#xd').value, jumlah: $('#xj').value }))) { toast('Tersimpan'); loadAdmin(); } }

/* ---- Laporan laba rugi: pilihan basis kas / basis tagihan ---- */
async function tLaporan() {
  const yr = window.RY || AD.hari_ini.slice(0, 4);
  const basis = window.RB || 'kas';
  $('#tab').innerHTML = '<div class="card">Memuat laporan…</div>';
  const R = await safe(() => A('report', { tahun: yr, basis })); if (!R) return;
  const T = R.total, cls = n => n < 0 ? 'neg' : '';
  const tagihan = basis === 'tagihan';
  $('#tab').innerHTML = `<div class="row" style="margin-bottom:8px;flex-wrap:wrap"><b>Laba rugi ${R.tahun}</b>
      <span style="display:flex;gap:6px"><select style="width:auto;margin:0" onchange="window.RB=this.value;tLaporan()"><option value="kas" ${!tagihan ? 'selected' : ''}>Basis kas</option><option value="tagihan" ${tagihan ? 'selected' : ''}>Basis tagihan</option></select>
      <select style="width:auto;margin:0" onchange="window.RY=this.value;tLaporan()">${[0, 1, 2].map(i => +AD.hari_ini.slice(0, 4) - i).map(y => `<option ${String(y) === String(R.tahun) ? 'selected' : ''}>${y}</option>`).join('')}</select></span></div>
    <div class="mut" style="margin-bottom:10px">${tagihan ? 'Basis tagihan: sewa yang sudah dibayar dicatat pada bulan periode tagihannya (sewa Desember yang dibayar November tampil di Desember). Pengeluaran tetap menurut tanggal.' : 'Basis kas: sewa dicatat pada tanggal uang diterima (sewa Desember yang dibayar November tampil di November).'}</div>
    <div class="grid"><div class="stat"><span class="mut">Pendapatan sewa</span><b>${rp(T.sewa)}</b></div><div class="stat"><span class="mut">Pendapatan denda</span><b>${rp(T.denda)}</b></div>${T.lain ? `<div class="stat"><span class="mut">Pendapatan lain (potongan deposit)</span><b>${rp(T.lain)}</b></div>` : ''}
    <div class="stat"><span class="mut">Pengeluaran</span><b>${rp(T.pengeluaran)}</b></div><div class="stat"><span class="mut">Laba bersih</span><b class="${cls(T.laba)}">${rp(T.laba)}</b></div></div>
    <div class="card" style="margin-top:12px;overflow-x:auto"><table><tr><th>Bulan</th><th>Sewa</th><th>Denda</th><th>Lain</th><th>Biaya</th><th>Laba</th></tr>
    ${R.bulan.map(b => `<tr><td>${MONTHS[b.m - 1]}</td><td>${rp(b.sewa)}</td><td>${rp(b.denda)}</td><td>${rp(b.lain || 0)}</td><td>${rp(b.pengeluaran)}</td><td class="${cls(b.laba)}">${rp(b.laba)}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td><b>${rp(T.sewa)}</b></td><td><b>${rp(T.denda)}</b></td><td><b>${rp(T.lain || 0)}</b></td><td><b>${rp(T.pengeluaran)}</b></td><td class="${cls(T.laba)}"><b>${rp(T.laba)}</b></td></tr></table></div>
    <div class="card" style="overflow-x:auto"><b>Per lokasi</b><table><tr><th>Lokasi</th><th>Pendapatan</th><th>Biaya</th><th>Laba</th></tr>
    ${R.lokasi.map(l => `<tr><td>${esc(l.nama)}</td><td>${rp(l.sewa + l.denda + (l.lain || 0))}</td><td>${rp(l.pengeluaran)}</td><td class="${cls(l.laba)}">${rp(l.laba)}</td></tr>`).join('')}</table></div>
    <div class="card"><b>Pengeluaran per kategori</b><table>${R.kategori.map(k => `<tr><td>${esc(k.nama)}</td><td>${rp(k.jumlah)}</td></tr>`).join('') || '<tr><td class="mut">Belum ada.</td></tr>'}</table></div>
    <p class="mut">Deposit diterima tahun ini: ${rp(T.deposit)} (kewajiban, bukan pendapatan, tidak masuk laba).</p>`;
}

start();
</script>
</body>
</html>
